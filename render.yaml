services:
  - type: web
    name: reviewsense
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.headless true --server.enableXsrfProtection false --server.enableCORS false
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
